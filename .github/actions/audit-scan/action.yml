name: Audit Scan
description: Parse pnpm audit JSON and manage GitHub Issues for vulnerabilities

inputs:
  audit_file:
    description: "Path to pnpm audit JSON output file"
    required: true

runs:
  using: composite
  steps:
    - name: Scan and create issues
      env:
        GH_TOKEN: ${{ github.token }}
        AUDIT_FILE: ${{ inputs.audit_file }}
      shell: bash
      run: bash "${{ github.action_path }}/audit-scan.sh" "$AUDIT_FILE"
