name: Claude Code

on:
  workflow_call:
    inputs:
      claude_model:
        description: "Claude model to use"
        required: false
        default: claude-sonnet-5
        type: string
      prompt:
        description: "Override default prompt (empty = use built-in default)"
        required: false
        default: ""
        type: string
      claude_args_extra:
        description: "Extra arguments appended to claude_args"
        required: false
        default: ""
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # claude-code-action runs its own `git fetch origin <pr-branch>` before
          # calling configureGitAuth, so we need actions/checkout to persist the
          # token in git config. Revisit once upstream fixes the setupBranch /
          # configureGitAuth ordering.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Resolve prompt
        id: resolve-prompt
        env:
          CUSTOM_PROMPT: ${{ inputs.prompt }}
        run: |
          {
            echo 'prompt<<PROMPT_EOF'
            if [ -n "$CUSTOM_PROMPT" ]; then
              printf '%s\n' "$CUSTOM_PROMPT"
            else
              cat <<'INNER_EOF'
          ユーザーのリクエストに日本語で対応してください。

          回答の最後に、使用したモデル名と実際のトークン数、推定コストを計算して出力してください。

          ---

          形式: 🤖 モデル: [実際のモデル名] / 💰 コスト: 入力[N]トークン, 出力[M]トークン, $[金額]
          INNER_EOF
            fi
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1.0.195
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          track_progress: true

          additional_permissions: |
            actions: read

          claude_args: '--model ${{ inputs.claude_model }} --allowed-tools "Write,Bash(gh issue create --title * --body-file *),Bash(gh issue comment * --body-file *)" ${{ inputs.claude_args_extra }}'

          prompt: ${{ steps.resolve-prompt.outputs.prompt }}
