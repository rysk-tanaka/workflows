name: Claude Code

on:
  workflow_call:
    inputs:
      claude_model:
        description: "Claude model to use"
        required: false
        default: claude-sonnet-4-6
        type: string
      prompt:
        description: "Override default prompt (empty = use built-in default)"
        required: false
        default: ""
        type: string
      claude_args_extra:
        description: "Extra arguments appended to claude_args"
        required: false
        default: ""
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          additional_permissions: |
            actions: read

          claude_args: '--model ${{ inputs.claude_model }} --allowed-tools "Write,Bash(gh issue create --title * --body-file *),Bash(gh issue comment * --body-file *)" ${{ inputs.claude_args_extra }}'

          prompt: ${{ inputs.prompt != '' && inputs.prompt || 'ユーザーのリクエストに日本語で対応してください。

            回答の最後に、使用したモデル名と実際のトークン数、推定コストを計算して出力してください。


            ---

            形式: 🤖 モデル: [実際のモデル名] / 💰 コスト: 入力[N]トークン, 出力[M]トークン, $[金額]' }}
