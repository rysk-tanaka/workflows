name: Dependabot Scan

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version"
        required: false
        default: "24"
        type: string
      package_manager:
        description: "Package manager (pnpm, npm, yarn)"
        required: false
        default: pnpm
        type: string

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dependabot-scan
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enable corepack
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: corepack enable "$PACKAGE_MANAGER"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          "$PACKAGE_MANAGER" install --frozen-lockfile

      - name: Run audit
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: |
          "$PACKAGE_MANAGER" audit --json > audit-result.json || true

      - name: Verify audit output
        run: |
          if ! jq -e '.advisories' audit-result.json > /dev/null 2>&1; then
            echo "::error::audit produced invalid output"
            cat audit-result.json
            exit 1
          fi

      - name: Scan and create issues
        uses: ./.github/actions/audit-scan
        with:
          audit_file: audit-result.json
