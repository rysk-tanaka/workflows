name: Dependabot Scan

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version"
        required: false
        default: "24"
        type: string
      package_manager:
        description: "Package manager (pnpm, npm, yarn)"
        required: false
        default: pnpm
        type: string

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dependabot-scan
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Enable corepack
        run: corepack enable ${{ inputs.package_manager }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        run: ${{ inputs.package_manager }} install --frozen-lockfile

      - name: Run audit
        run: ${{ inputs.package_manager }} audit --json > audit-result.json || true

      - name: Verify audit output
        run: |
          if ! jq -e '.advisories' audit-result.json > /dev/null 2>&1; then
            echo "::error::audit produced invalid output"
            cat audit-result.json
            exit 1
          fi

      - name: Scan and create issues
        uses: ./.github/actions/audit-scan
        with:
          audit_file: audit-result.json
