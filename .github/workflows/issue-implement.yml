name: Issue Implement

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version"
        required: false
        default: "24"
        type: string
      package_manager:
        description: "Package manager (pnpm, npm, yarn, none)"
        required: false
        default: none
        type: string
      install_command:
        description: "Custom install command (overrides default for package_manager)"
        required: false
        default: ""
        type: string
      setup_command:
        description: "Command to run before Claude (e.g. install uv, setup Python)"
        required: false
        default: ""
        type: string
      claude_args:
        description: "Full claude_args string"
        required: true
        type: string
      prompt:
        description: "Full prompt string"
        required: true
        type: string
      allowed_bots:
        description: "Bots allowed to trigger this workflow"
        required: false
        default: "claude[bot]"
        type: string
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        default: 30
        type: number
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          # claude-code-action runs its own `git fetch origin <pr-branch>` before
          # calling configureGitAuth, so we need actions/checkout to persist the
          # token in git config. Revisit once upstream fixes the setupBranch /
          # configureGitAuth ordering.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Check for existing implementation PR
        id: guard
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: "open",
                per_page: 100,
              }
            );

            const closesPattern = new RegExp(
              `(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+\`?#${issueNumber}\`?\\b`,
              "i"
            );

            const existingPr = pullRequests.find((pr) =>
              closesPattern.test(pr.body ?? "") ||
              pr.head?.ref === `implement-issue-${issueNumber}`
            );

            if (existingPr) {
              core.info(
                `Existing PR found for issue #${issueNumber}: #${existingPr.number}`
              );
              core.setOutput("skip", "true");
              core.setOutput("existing_pr_number", String(existingPr.number));
              return;
            }

            core.setOutput("skip", "false");

      - name: Skip when implementation PR already exists
        if: steps.guard.outputs.skip == 'true'
        env:
          EXISTING_PR: ${{ steps.guard.outputs.existing_pr_number }}
        run: |
          echo "Existing PR: #${EXISTING_PR}"

      - name: Enable corepack
        if: steps.guard.outputs.skip != 'true' && inputs.package_manager != 'none'
        env:
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        run: corepack enable "$PACKAGE_MANAGER"

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true' && inputs.package_manager != 'none'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true' && inputs.package_manager != 'none'
        # zizmor: ignore[template-injection] caller-provided command, intentionally executed
        run: ${{ inputs.install_command != '' && inputs.install_command || format('{0} install --frozen-lockfile', inputs.package_manager) }}

      - name: Run setup command
        if: steps.guard.outputs.skip != 'true' && inputs.setup_command != ''
        # zizmor: ignore[template-injection] caller-provided command, intentionally executed
        run: ${{ inputs.setup_command }}

      - name: Configure git identity
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Implement issue with Claude
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@11a9dadd198803a0cea6bd53da3e0e8a762fc6ea # v1.0.108
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          allowed_bots: ${{ inputs.allowed_bots }}
          claude_args: ${{ inputs.claude_args }}
          prompt: ${{ inputs.prompt }}

      - name: Post report to issue
        if: (success() || failure()) && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then
            SUMMARY_SIZE=$(wc -c < "$GITHUB_STEP_SUMMARY")
            if [ "$SUMMARY_SIZE" -le 65000 ]; then
              gh issue comment "$ISSUE_NUMBER" \
                --body-file "$GITHUB_STEP_SUMMARY"
            else
              gh issue comment "$ISSUE_NUMBER" \
                --body "実装レポート（サマリーが長すぎるため省略: ${JOB_STATUS}）。${RUN_URL} @${REPO_OWNER}"
            fi
          elif [ "$JOB_STATUS" = "failure" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "自動実装に失敗しました。${RUN_URL} @${REPO_OWNER}"
          fi
